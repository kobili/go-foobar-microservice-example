services:
  foo:
    build:
      context: .
      dockerfile: ./docker/foo/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - SERVER_PORT=8000

  bar:
    build:
      context: .
      dockerfile: ./docker/bar/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - SERVER_PORT=8080

  foobar:
    build:
      context: .
      dockerfile: ./docker/foobar/Dockerfile
    ports:
      - "8081:8081"
    environment:
      - FOO_SERVICE_URL=${FOO_SERVICE_URL}
      - BAR_SERVICE_URL=${BAR_SERVICE_URL}
      - SERVER_PORT=8081
